<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in | prizma</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f6f8">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
<style>
/* The sign-in gate, in the landing's look: cool neutrals, one white panel that lifts off the page
   with a soft shadow, 20 px outside and 12 px inside, pills for anything you press. */
:root {
  --paper: #f5f6f8;
  --card: #ffffff;
  --ink: #0e1116;
  --ink-2: #4a5160;
  --ink-3: #8b919d;
  --mute: #9aa0ac;
  --line: #e6e9ee;
  --rule: #d6dae1;
  --hotel: #2e7bd0;
  --casa: #d9539a;
  --school: #0a9396;
  --offices: #7a5bd6;
  --lift: 0 1px 2px rgb(14 17 22 / 0.05), 0 30px 70px -30px rgb(14 17 22 / 0.3);
  --lift-sm: 0 1px 2px rgb(14 17 22 / 0.04), 0 10px 28px -18px rgb(14 17 22 / 0.14);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --sans: 'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color-scheme: light;
}
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1,
p {
  margin: 0;
}
a {
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
  border-radius: 8px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 1400px;
  height: 60px;
  margin: 0 auto;
  padding: 0 max(24px, env(safe-area-inset-right, 0px)) 0 max(24px, env(safe-area-inset-left, 0px));
}
.brand {
  font-size: 23px;
  font-weight: 650;
  line-height: 1;
  letter-spacing: -0.045em;
  text-decoration: none;
}
.back {
  font-size: 14px;
  color: var(--ink-2);
  text-decoration: none;
  transition: color 0.2s ease;
}
.back:hover {
  color: var(--ink);
}
main {
  display: grid;
  flex: 1;
  place-items: center;
  padding: 24px 16px 56px;
}
.card {
  width: 100%;
  max-width: 408px;
  padding: 34px 34px 30px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--lift);
  animation: settle 0.9s var(--ease) both;
}
@keyframes settle {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  height: 30px;
  margin-bottom: 22px;
  padding: 0 13px 0 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  background: var(--paper);
  border-radius: 999px;
}
.tag i {
  width: 9px;
  height: 9px;
  background: conic-gradient(var(--hotel), var(--offices), var(--casa), var(--school), var(--hotel));
  border-radius: 50%;
}
h1 {
  font-size: 34px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.04em;
  color: var(--mute);
}
h1 b {
  font-weight: inherit;
  color: var(--ink);
}
form {
  margin-top: 26px;
}
label {
  display: block;
  margin-bottom: 7px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-2);
}
.fgroup + .fgroup {
  margin-top: 16px;
}
.inwrap {
  position: relative;
}
input {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  font: inherit;
  font-size: 15.5px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid transparent;
  border-radius: 12px;
  outline: none;
  transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}
input::placeholder {
  color: var(--ink-3);
}
input:focus {
  background: var(--card);
  border-color: var(--ink);
  box-shadow: 0 0 0 4px rgb(14 17 22 / 0.08);
}
#password {
  padding-right: 46px;
}
.reveal {
  position: absolute;
  top: 50%;
  right: 6px;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  color: var(--ink-3);
  background: none;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  transform: translateY(-50%);
}
.reveal:hover {
  color: var(--ink);
}
.reveal svg {
  width: 18px;
  height: 18px;
}
.forgot-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}
.forgot {
  font-size: 13px;
  color: var(--ink-2);
  text-decoration: none;
}
.forgot:hover {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 48px;
  margin-top: 20px;
  font: inherit;
  font-weight: 500;
  color: var(--paper);
  background: var(--ink);
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.2s var(--ease), background 0.2s ease;
}
.btn:hover {
  background: #262b36;
}
.btn:active {
  transform: scale(0.98);
}
.notice {
  margin-top: 16px;
  padding: 13px 15px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-2);
  background: var(--paper);
  border-radius: 12px;
  animation: settle 0.5s var(--ease) both;
}
.notice[hidden] {
  display: none;
}
.notice b {
  font-weight: 600;
  color: var(--ink);
}
.foot {
  padding: 0 24px 26px;
  font-size: 13px;
  color: var(--ink-3);
  text-align: center;
}
@media (max-width: 480px) {
  .card {
    padding: 26px 22px 24px;
    border-radius: 16px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="prizma home">prizma</a>
  <a class="back" href="/">Back to the site</a>
</header>

<main>
  <div class="card">
    <p class="tag"><i></i>Private pilot</p>
    <h1>Sign in <b>to your studio.</b></h1>
    <form id="loginForm" novalidate>
      <div class="fgroup">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@yourfirm.com">
      </div>
      <div class="fgroup">
        <label for="password">Password</label>
        <div class="inwrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
          <button class="reveal" type="button" id="reveal" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
          </button>
        </div>
        <div class="forgot-row">
          <a class="forgot" href="mailto:contact@heyprizma.com?subject=Password%20reset">Forgot your password?</a>
        </div>
      </div>
      <button class="btn" type="submit">Sign in</button>
      <p class="notice" id="notice" role="status" hidden>
        <b>Pilot accounts only, for now.</b> If your firm is in the pilot, use the credentials you were given. If it is not yet, write to <a href="mailto:contact@heyprizma.com?subject=Pilot%20enquiry">contact@heyprizma.com</a>.
      </p>
    </form>
  </div>
</main>

<footer class="foot">Accounts are set up per firm.</footer>

<script>
document.getElementById('reveal').addEventListener('click', function () {
  var p = document.getElementById('password')
  var show = p.type === 'password'
  p.type = show ? 'text' : 'password'
  this.setAttribute('aria-pressed', String(show))
  this.setAttribute('aria-label', show ? 'Hide password' : 'Show password')
})
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault()
  document.getElementById('notice').hidden = false
})
</script>
</body>
</html>
